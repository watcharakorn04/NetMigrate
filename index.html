<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetMigrate — Network CLI Translation & Deployment</title>
    <meta name="description" content="A high-trust network CLI configuration translator and deployment management tool for Cisco IOS-XE and Huawei VRP." />
    <meta property="og:title" content="NetMigrate — Network CLI Translation & Deployment" />
    <meta property="og:description" content="A high-trust network CLI configuration translator and deployment management tool for Cisco IOS-XE and Huawei VRP." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Immediate theme initialization to prevent flash
      try {
        const savedTheme = localStorage.getItem('netmigrate_theme') || 'dark';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const savedLang = localStorage.getItem('netmigrate_lang') || 'en';
        document.documentElement.setAttribute('lang', savedLang);
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
